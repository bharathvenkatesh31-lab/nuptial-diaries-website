<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Album Studio — Nuptial Diaries</title>
<link rel="stylesheet" href="studio.css?v=8">
<!-- Points the editor at its settings with a version on the end. Without
     this the browser serves a cached config.yml and edits to it appear to
     do nothing. Raise the number whenever config.yml changes. -->
<link rel="cms-config-url" type="text/yaml" href="config.yml?v=6">
<script src="studio.js?v=2" defer></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
<script>
  // Rename the things the editor calls itself, so it reads as your own tool.
  window.addEventListener("load", function () {
    if (!window.CMS) {
      document.body.innerHTML =
        '<p style="font:300 17px/1.7 system-ui;max-width:38rem;margin:15vh auto;padding:0 1.5rem">' +
        'The editor could not load. It needs an internet connection the first time. ' +
        'Check you are online and reload this page.</p>';
    }
  });
</script>
</body>
</html>
