# ==========================================================================
# Album Studio — the editor that runs at /admin
#
# local_backend: true means it edits the files on this Mac directly, with no
# accounts and nothing online. When we move to the real site this line is
# swapped for the GitHub details and everything else stays the same.
# ==========================================================================

# --------------------------------------------------------------------------
# WHO CAN EDIT
#
# On the live website, editing goes through GitHub — you sign in with your
# GitHub account and your changes are saved there, which publishes the site.
#
# local_backend stays switched on as well. It only ever applies when the site
# is running on your own Mac (via "Edit Website.command"), where it edits the
# files directly and needs no login. The live site ignores it.
#
# The GitHub app's Client ID is Ov23liTsTRO6lO4P0lNU. It and the secret live
# in Netlify's settings, not in this file.
# --------------------------------------------------------------------------

local_backend: true

backend:
  name: github
  repo: bharathvenkatesh31-lab/nuptial-diaries-website
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# --------------------------------------------------------------------------
# WHERE PHOTOGRAPHS GO
#
# Photographs you upload go to Cloudinary, not into this folder. Upload the
# full-size file straight off the camera — Cloudinary sends each visitor a
# version sized for their screen, around 200 KB instead of 15 MB.
#
# Both values below are public and safe to have here.
# The API Secret is not needed and must never be put in this file.
# --------------------------------------------------------------------------

# Photographs you upload go into the site itself, in images/uploads, exactly
# like the 970 brought over from WordPress. One system, no outside account.
#
# There was a Cloudinary account here (cloud "jdvgizll") from the first build.
# It is a real account, but nobody could confirm it was Bharath's — so it has
# been taken out rather than risk uploading clients' photographs into storage
# he does not control. If it does turn out to be his, it can go back.

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:

  # ---------------------------------------------------------------- Settings
  - name: "settings"
    label: "Site settings"
    editor:
      preview: false
    files:
      - name: "studio"
        label: "Studio details"
        file: "content/site.json"
        description: "Your contact details and the words on the front page."
        fields:
          - { name: whatsapp, label: "WhatsApp number (91 then 10 digits, no spaces)", widget: string }
          - { name: phoneDisplay, label: "Phone, shown on the page", widget: string }
          - { name: email, label: "Email", widget: string }
          - { name: city, label: "Based in", widget: string }

          - label: "Front page — the big picture"
            name: hero
            widget: object
            fields:
              - { name: image, label: "Photograph", widget: image }
              - { name: headline, label: "Headline", widget: string,
                  hint: "Put the word you want in gold between *stars*, e.g. A Symphony of *Love* & Light" }
              - { name: subline, label: "Line underneath", widget: string }

          - label: "Front page — the statement"
            name: statement
            widget: object
            fields:
              - { name: line1, label: "First line", widget: string }
              - { name: line2, label: "Second line", widget: string,
                  hint: "Gold word between *stars*" }
              - { name: leftImage, label: "Left photograph", widget: image }
              - { name: rightImage, label: "Right photograph", widget: image }
              - { name: body, label: "Paragraphs", widget: text }

          - label: "Front page — the photo wall"
            name: wall
            widget: object
            fields:
              - { name: tileNumber, label: "Number on the white card", widget: string }
              - { name: tileLine, label: "Words on the white card", widget: string }
              - label: "Photographs"
                name: photos
                widget: list
                label_singular: "Photograph"
                summary: "{{fields.image}}"
                hint: "Drag to reorder. The white card always sits in the middle of the wall."
                fields:
                  - { name: image, label: "Photograph", widget: image }
                  - { name: blackAndWhite, label: "Show in black and white", widget: boolean, default: false, required: false }

  # ---------------------------------------------------------------- Weddings
  - name: "weddings"
    label: "Weddings"
    # The side preview cannot resolve the photograph paths — they are relative
    # to the site, and the editor runs at /admin/ — so it drew a thousand
    # broken images on every album. "Check for Preview" opens the real site.
    editor:
      preview: false
    files:
      - name: "list"
        label: "All weddings"
        file: "content/weddings.json"
        description: "Every wedding album. Drag to reorder — the top one shows first."
        fields:
          - label: "Weddings"
            name: weddings
            widget: list
            label_singular: "Wedding"
            # Without the kind, a couple's two albums are two identical lines,
            # and with city empty on every album it just read "Name —".
            summary: "{{fields.name}} · {{fields.kind}}"
            fields:
              - { name: name, label: "Couple", widget: string }
              - { name: slug, label: "Web name", widget: string,
                  hint: "lowercase, hyphens, no spaces — becomes the link, e.g. riya-arjun" }
              # A couple can have two albums: the wedding and the pre-wedding
              # shoot. This is what tells them apart on the Photography page,
              # and what keeps pre-wedding shoots out of the weddings count.
              - { name: kind, label: "Which shoot is this?", widget: select, required: false,
                  options: ["Wedding", "Pre-Wedding"],
                  hint: "Leave empty for an ordinary wedding album." }
              # The four below may be left empty. The albums brought over from the
              # old site have no city, date or story recorded, so the album page
              # simply leaves those lines out until you fill them in.
              - { name: city, label: "City", widget: string, required: false,
                  hint: "e.g. Bangalore. Leave empty if you would rather not say." }
              - { name: date, label: "Month and year", widget: string, required: false,
                  hint: "e.g. March 2024" }
              - { name: excerpt, label: "One line for the Photography page", widget: string, required: false }
              - { name: story, label: "Their story", widget: text, required: false,
                  hint: "If you write a story here it replaces the couple's review on their album page." }
              - { name: quote, label: "The couple's own words", widget: text, required: false,
                  hint: "Their review, shown on the album page when there is no story." }
              - { name: quoteBy, label: "Who said it", widget: string, required: false,
                  hint: "e.g. Soniya & Karan" }
              - { name: cover, label: "Cover photograph", widget: image }
              - label: "Photographs"
                name: photos
                widget: list
                # collapsed: false so every photograph shows as a picture. Left
                # collapsed, each is a row reading only "Photograph", and an
                # album of forty-five is forty-five rows to open one at a time.
                collapsed: false
                field: { name: src, label: "Photograph", widget: image }
